<!DOCTYPE html>
<html>
<head>
    <title>Crawl4AI Web Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #1a1a1a;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .help {
            color: #666;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            margin-bottom: 1rem;
            resize: vertical;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #93c5fd;
            cursor: not-allowed;
        }

        .copy-button {
            background: #059669;
            margin-left: 8px;
        }

        .copy-button:hover {
            background: #047857;
        }

        .copy-button.copied {
            background: #047857;
        }

        .error {
            color: #dc2626;
            padding: 12px;
            background: #fef2f2;
            border-radius: 6px;
            margin: 1rem 0;
        }

        .loading {
            color: #2563eb;
            padding: 12px;
            background: #eff6ff;
            border-radius: 6px;
            margin: 1rem 0;
        }

        .result-item {
            margin: 1.5rem 0;
            padding: 1rem;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
        }

        .result-item h3 {
            color: #1f2937;
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        pre {
            background: #f8fafc;
            padding: 1rem;
            border-radius: 6px;
            overflow-x: auto;
            font-size: 14px;
            line-height: 1.5;
            border: 1px solid #e5e7eb;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Crawl4AI Web Interface</h1>
        <p class="help">Enter one or more URLs to crawl (one per line). The protocol (http:// or https://) will be added automatically if not provided.</p>
        <textarea id="urls" placeholder="Enter URLs (one per line)&#10;Example:&#10;reddit.com&#10;example.com" rows="5"></textarea>
        <button onclick="crawl()" id="crawlButton">Crawl</button>
        <div id="results"></div>
    </div>

    <script>
        async function copyToClipboard(text, button) {
            try {
                await navigator.clipboard.writeText(text);
                button.textContent = 'Copied!';
                button.classList.add('copied');
                setTimeout(() => {
                    button.textContent = 'Copy';
                    button.classList.remove('copied');
                }, 2000);
            } catch (err) {
                console.error('Failed to copy text: ', err);
            }
        }

        async function crawl() {
            const urlsText = document.getElementById('urls').value;
            const urls = urlsText.split('\n').map(url => url.trim()).filter(url => url);
            const crawlButton = document.getElementById('crawlButton');
            
            if (urls.length === 0) {
                document.getElementById('results').innerHTML = '<div class="error">Please enter at least one URL</div>';
                return;
            }

            crawlButton.disabled = true;
            document.getElementById('results').innerHTML = '<div class="loading">Crawling URLs... Please wait.</div>';
            
            try {
                const response = await fetch('/crawl', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ urls })
                });
                
                const results = await response.json();
                const resultsDiv = document.getElementById('results');
                
                if (results.error) {
                    resultsDiv.innerHTML = `<div class="error">Error: ${results.error}</div>`;
                    return;
                }

                resultsDiv.innerHTML = results.map(result => 
                    `<div class="result-item">
                        <h3>
                            ${result.url}
                            ${!result.error ? 
                                `<button class="copy-button" onclick="copyToClipboard('${result.markdown.replace(/'/g, "\\'")}', this)">Copy</button>` : 
                                ''}
                        </h3>
                        ${result.error ? 
                            `<div class="error">Error: ${result.error}</div>` : 
                            `<pre>${result.markdown}</pre>`}
                    </div>`
                ).join('');
            } catch (error) {
                document.getElementById('results').innerHTML = `<div class="error">Error: ${error.message}</div>`;
            } finally {
                crawlButton.disabled = false;
            }
        }

        // Add keyboard shortcut (Enter) for the textarea
        document.getElementById('urls').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && e.ctrlKey) {
                e.preventDefault();
                crawl();
            }
        });
    </script>
</body>
</html>
